[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-prep"
version = "0.1.0"
description = "AI-powered manuscript analysis for audiobook narrators"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Zach"}
]
keywords = ["audiobook", "narration", "manuscript", "analysis", "NLP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "spacy>=3.7.0",
    "pronouncing>=0.2.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ipython>=8.0.0",
    "black",
    "ruff",
]
llm = [
    "llama-cpp-python>=0.2.0",
]
full = [
    "audiobook-prep[dev,llm]",
]

[project.scripts]
audiobook-prep = "src.cli:main"
audiobook-prep-gui = "src.gui.desktop:main"

[project.urls]
Homepage = "https://github.com/zachaudiobook/audiobook-prep"
Documentation = "https://github.com/zachaudiobook/audiobook-prep#readme"
Issues = "https://github.com/zachaudiobook/audiobook-prep/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
